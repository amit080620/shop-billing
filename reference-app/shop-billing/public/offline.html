<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f7f6f2;
    color: #1a1d1e;
    text-align: center;
    padding: 24px;
  }
  .card { max-width: 320px; }
  .badge {
    width: 56px; height: 56px; border-radius: 16px;
    background: linear-gradient(135deg, #178a76, #0a4f44);
    color: white; font-size: 28px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
  }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 14px; color: #6b7075; line-height: 1.5; margin: 0 0 20px; }
  button {
    background: #0f6b5c; color: white; border: none;
    padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">₹</div>
    <h1>No internet connection</h1>
    <p>This app needs internet to bill and sync — reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
