# The test robot (Playwright, see playwright.config.ts and e2e/): after every deploy, and each
# morning, it walks the main jobs on the live site — Sell, Fast Billing quantities, customer
# suggestions, a real bill for a new customer (cleaned up after), videos, restaurant tables, the
# app download — on a phone-sized screen with touch. A failure emails the repository owner, with
# screenshots and a trace in the run's report.
name: App tests

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 3 * * *" # 08:45 in India
  workflow_dispatch:

concurrency:
  group: e2e
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the new deploy to go live
        if: github.event_name == 'push'
        run: |
          before=$(curl -s -m 10 https://bill.theray.in/api/version || true)
          for i in $(seq 1 80); do
            sleep 10
            now=$(curl -s -m 10 https://bill.theray.in/api/version || true)
            if [ -n "$now" ] && [ "$now" != "$before" ]; then echo "live: $now"; exit 0; fi
          done
          echo "no new deploy seen; testing whatever is live"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run the tests
        run: npx playwright test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Keep the report (screenshots, trace) when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
