# Keeps The Ray's servers awake during shop hours. A screen nobody has opened for a while has to
# start its server from cold, which can take 2–5 seconds on the first tap; a light request to each
# main screen every 5 minutes means a shop never waits for that. Unauthenticated, so each request
# only reaches the login check — enough to keep the server warm, nothing else runs.
name: Keep the app warm

on:
  schedule:
    # Every 5 minutes, all day: shops open early, restaurants close late, and an idle server is
    # exactly when the first tap is slow. (While a shop has the app open, useKeepReady keeps its
    # own screens warm too.)
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake the main screens
        run: |
          for path in / /login /dashboard /bills/new /fast-billing /bills /customers /products /purchases /reports /more /plans /offers /help /daily-summary /reminders /restaurant /restaurant-kds /hotel /videos /api/version /api/customers/search /api/customers/all; do
            curl -s -o /dev/null -m 25 -w "%{http_code} %{time_total}s ${path}\n" "https://bill.theray.in${path}" &
          done
          wait
